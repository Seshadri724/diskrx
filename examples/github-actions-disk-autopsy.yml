name: Build & CI Disk Autopsy Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Disk baseline
        uses: Seshadri724/diskrx@v1
        with:
          mode: start

      - name: Execute Heavy Build / Docker Test Matrix
        run: |
          docker build -t myapp:test -f demo/Dockerfile.test demo/
          echo "Build completed; add your integration tests here."

      - name: Disk autopsy
        if: always()
        uses: Seshadri724/diskrx@v1
        with:
          mode: finish
          fail-on-growth: "15G"
