name: Disk autopsy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: disk-autopsy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autopsy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Disk baseline
        uses: ./
        with:
          mode: start
          docker: "false"

      - name: Simulated build growth
        run: |
          mkdir -p build/.cache
          dd if=/dev/zero of=build/.cache/blob bs=1M count=12 status=none

      - name: Disk autopsy
        if: always()
        uses: ./
        with:
          mode: finish
          docker: "false"
          pr-comment: "true"
          summary: "true"
