# .github/workflows/test.yml
name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.8"
            numpy-version: "numpy<1.25"
          - os: ubuntu-latest
            python-version: "3.9"
            numpy-version: "numpy<2.0"
          - os: ubuntu-latest
            python-version: "3.10"
            numpy-version: "numpy<2.0"
          - os: ubuntu-latest
            python-version: "3.11"
            numpy-version: "numpy>=2.0.0"
          - os: ubuntu-latest
            python-version: "3.12"
            numpy-version: "numpy>=2.0.0"
          - os: macos-latest
            python-version: "3.12"
            numpy-version: "numpy>=2.0.0"
          - os: windows-latest
            python-version: "3.12"
            numpy-version: "numpy>=2.0.0"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,server]"
          pip install "${{ matrix.numpy-version }}"

      - name: Run tests
        run: pytest tests/ -v -W error::RuntimeWarning

      - name: Lint
        if: matrix.python-version == '3.11'
        run: |
          flake8 dxcli tests plugins
          black --check --fast dxcli tests plugins

      - name: Security scan
        if: matrix.python-version == '3.11'
        run: bandit -r dxcli -q -ll
