# .github/workflows/test.yml
name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            numpy-version: "numpy<1.25"
          - python-version: "3.9"
            numpy-version: "numpy<2.0"
          - python-version: "3.10"
            numpy-version: "numpy<2.0"
          - python-version: "3.11"
            numpy-version: "numpy>=2.0.0"
          - python-version: "3.12"
            numpy-version: "numpy>=2.0.0"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,server]"
          pip install "${{ matrix.numpy-version }}"

      - name: Run tests
        run: pytest tests/ -v -W error::RuntimeWarning

      - name: Lint
        if: matrix.python-version == '3.11'
        run: |
          flake8 dxcli tests plugins
          black --check dxcli tests plugins

      - name: Security scan
        if: matrix.python-version == '3.11'
        run: bandit -r dxcli -q -ll
