# .github/workflows/test.yml
name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        numpy-version: ["numpy>=2.0.0"]
        include:
          - python-version: "3.8"
            numpy-version: "numpy<1.25"
          - python-version: "3.10"
            numpy-version: "numpy<1.25"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install "${{ matrix.numpy-version }}"
      
      - name: Run tests
        run: pytest tests/ -v -W error::RuntimeWarning

      - name: Lint
        run: |
          flake8 dxcli --max-line-length=120 --extend-ignore=E203,W503
          black --check dxcli

      - name: Security scan
        run: bandit -r dxcli -q -ll

