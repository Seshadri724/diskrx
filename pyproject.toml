[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dxcli"
version = "0.3.0"
description = "The disk doctor for your CI pipeline and dev box — diagnose what filled the drive, which process did it, and fail fast in CI"
authors = [
    {name = "Seshadri Naidu Vangapandu", email = "seshuvangapandu@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
keywords = [
    "disk",
    "diagnostics",
    "ci",
    "ci-cd",
    "github-actions",
    "docker",
    "devops",
    "developer-tools",
    "build",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "textual>=0.50",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "bandit>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/Seshadri724/dxcli"
Repository = "https://github.com/Seshadri724/dxcli"
Issues = "https://github.com/Seshadri724/dxcli/issues"

[project.scripts]
dxcli = "dxcli.cli:cli"

[tool.setuptools.packages.find]
include = ["dxcli*"]
exclude = ["plugins*", "tests*"]

[tool.setuptools.package-data]
dxcli = ["outputs/*.tcss"]
