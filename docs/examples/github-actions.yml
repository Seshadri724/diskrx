# Drop this into .github/workflows/disk-guard.yml
# Runs dxcli before the build; fails fast if the runner is unhealthy.

name: Build with disk guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dxcli
        run: pip install dxcli

      - name: Pre-build disk guard
        run: dxcli ci

      - name: Build
        run: ./build.sh

      - name: Post-build disk report (if build failed)
        if: failure()
        run: dxcli diagnose . --docker --report disk-report.html

      - name: Upload disk report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dxcli-disk-report
          path: disk-report.html
