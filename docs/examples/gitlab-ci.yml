# Drop this into .gitlab-ci.yml.
# Pre-build disk guard plus an automatic post-failure report.

stages:
  - guard
  - build

disk-guard:
  stage: guard
  image: python:3.12-slim
  script:
    - pip install dxcli
    - dxcli ci

build:
  stage: build
  image: python:3.12-slim
  script:
    - pip install dxcli
    - ./build.sh
  after_script:
    - pip install dxcli
    - dxcli diagnose . --docker --report disk-report.html || true
  artifacts:
    when: on_failure
    paths:
      - disk-report.html
    expire_in: 1 week
